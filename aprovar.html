<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento</title>
<style>
/* paleta da logo: azul, vermelho, verde, prata e azul-marinho */
:root{--h:209;--s:92%;--l:44%;--ac:hsl(var(--h) var(--s) var(--l));--ac-d:hsl(var(--h) var(--s) calc(var(--l) - 9%));--ac2:hsl(var(--h) calc(var(--s) * .5) 95%);--hd:hsl(var(--h) 90% 7%);--stripe:linear-gradient(90deg,var(--ac) 0,#e11d25 55%,#62b312 100%);--on:#fff;--bg:#f1f5fb;--card:#fff;--tx:#0e1a2e;--mu:#5d6b82;--bd:#dde4ef;--dg:#d71920;--okc:#3a8d12;--sh:0 1px 2px rgba(8,20,45,.06),0 3px 12px rgba(8,20,45,.05)}
@media (prefers-color-scheme:dark){:root{--l:55%;--ac2:hsl(var(--h) calc(var(--s) * .45) 20%);--hd:hsl(var(--h) 90% 5%);--bg:#070d1a;--card:#0f1829;--tx:#e7edf8;--mu:#93a1b8;--bd:#1f2d46;--dg:#ff6b6f;--okc:#7ed321;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:700px;margin:auto;padding:0 16px 48px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card.brand{background:var(--hd);color:#fff;border:0;border-radius:0 0 20px 20px;margin:0 -16px 16px;padding:24px 22px 30px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.card.brand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--stripe)}
.card.brand img{border-radius:10px;margin:0!important;max-height:60px!important;max-width:190px!important}
.card.brand .mu{color:#c9d6ea}
h1{font-size:20px;margin:0}.mu{color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.r,th.r{text-align:right}
.tot{text-align:right;font-size:22px;font-weight:700;margin-top:14px;color:var(--ac)}
textarea{width:100%;min-height:84px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-top:8px}
textarea:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.b{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{flex:1;min-width:140px;border:0;border-radius:11px;padding:14px;color:#fff;font:700 15px inherit;cursor:pointer}
button:hover{filter:brightness(.93)}
.a{background:#3a8d12}.n{background:#d71920}.v{background:var(--ac)}
.st{font-weight:700;padding:12px;border-radius:10px;background:var(--ac2);color:var(--ac);text-align:center;margin-top:12px}
</style></head><body><main id="app"><p class="mu">Carregando…</p></main>
<script>
// >>> Preencha com os dados do seu projeto Supabase (Project Settings > API)
const SUPABASE_URL='https://wbwzwqrfvwymuluznqyt.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indid3p3cXJmdnd5bXVsdXpucXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODk4NDgsImV4cCI6MjEwNzc2NTg0OH0.aR1a1AtZ5jB-r7GpQ7F4O4IyQbOp8lrHkSZlvpPcx0A';

const $=id=>document.getElementById(id);
function hex2hsl(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return null;const n=parseInt(m[1],16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360}return{h,s:Math.round(s*100)}}
function applyTheme(hex){const c=hex2hsl(hex),r=document.documentElement.style;
 if(!c||c.s<12){r.removeProperty('--h');r.removeProperty('--s');return}
 r.setProperty('--h',c.h);r.setProperty('--s',Math.min(85,Math.max(45,c.s))+'%');
 try{localStorage.setItem('orc-tema',hex)}catch(e){}}
try{applyTheme(localStorage.getItem('orc-tema'))}catch(e){}
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const token=new URLSearchParams(location.search).get('t');
const msg=t=>{$('app').innerHTML='<div class="card">'+esc(t)+'</div>'};

async function rpc(fn,body){
  const h={'Content-Type':'application/json',apikey:SUPABASE_KEY};
  if(SUPABASE_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SUPABASE_KEY;
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status);return r.json();
}

async function load(){
  if(!token)return msg('Link inválido.');
  try{const o=await rpc('orcamento_publico',{p_token:token});
    if(!o)return msg('Orçamento não encontrado.');show(o)}
  catch(e){msg('Não foi possível carregar o orçamento. Tente novamente em instantes.')}
}

function show(o){applyTheme((o.empresa||{}).cor);
  const c=o.condicoes||{},tem=Object.keys(c).length>0,v=c.val||10,L=[];
  if(tem){L.push('Validade da proposta: '+v+' dias (até '+new Date(new Date(o.data+'T00:00:00').getTime()+v*864e5).toLocaleDateString('pt-BR')+')');
    if(c.prazo)L.push('Prazo para execução do serviço: '+c.prazo);
    L.push('Garantia de serviço: '+(c.gs||'90 dias'));
    L.push('Garantia de equipamentos: '+(c.ge||'1 ano, conforme o fabricante'));
    L.push('Forma de pagamento: '+(c.pag==='Cartão'?'Cartão de crédito em '+(c.parc||1)+'x de '+R(o.total/(c.parc||1)):'PIX'))}
  const e=o.empresa||{},aberto=o.status==='Pendente'||o.status==='Em revisão';
  $('app').innerHTML=`
  <div class="card brand">${e.logo&&String(e.logo).startsWith('data:image/')?'<img src="'+e.logo+'" alt="" style="max-height:56px;max-width:180px;display:block;margin-bottom:8px">':''}<h1>${esc(e.nome||'Orçamento')}</h1>
    <div class="mu">${esc([e.doc,e.tel,e.mail].filter(Boolean).join(' · '))}</div></div>
  <div class="card">
    <b>Orçamento nº ${esc(o.numero)}${o.rev?' (revisão '+o.rev+')':''}</b>
    <div class="mu">${esc(o.data)} · Cliente: ${esc(o.cliente)}${o.contato?' (A/C '+esc(o.contato)+')':''}</div>
    ${o.descricao?'<p>'+esc(o.descricao)+'</p>':''}
    <table><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Unit.</th><th class="r">Total</th></tr></thead><tbody>
    ${(o.itens||[]).map(i=>`<tr><td>${esc(i.nome)}</td><td class="r">${esc(i.q)}</td><td class="r">${R(i.u)}</td><td class="r">${R(i.q*i.u)}</td></tr>`).join('')}
    </tbody></table>
    <div class="tot">Total: ${R(o.total)}</div>${L.length?'<div style="margin-top:12px;font-size:13px"><b>Condições</b><br>'+L.map(esc).join('<br>')+'</div>':''}</div>
  ${aberto?`<div class="card"><b>Sua resposta</b>
    <textarea id="nota" placeholder="Observações. Para pedir revisão, diga quais itens incluir ou retirar."></textarea>
    <div class="b"><button class="a" onclick="resp('Aprovado')">Aprovar</button>
    <button class="n" onclick="resp('Recusado')">Rejeitar</button>
    <button class="v" onclick="resp('Em revisão')">Pedir revisão</button></div></div>`
  :`<div class="st">Status: ${esc(o.status)}</div>`}
  ${o.status==='Em revisão'?'<p class="mu">Seu pedido de revisão foi enviado. Você pode responder de novo quando receber o orçamento atualizado.</p>':''}`;
}

window.resp=async r=>{
  const nota=$('nota').value.trim();
  if(r==='Em revisão'&&!nota)return alert('Escreva quais itens deseja incluir ou retirar.');
  if(r!=='Em revisão'&&!confirm((r==='Aprovado'?'Aprovar':'Rejeitar')+' este orçamento?'))return;
  try{const s=await rpc('responder_orcamento',{p_token:token,p_resposta:r,p_nota:nota});
    if(s==='indisponivel')alert('Este orçamento já foi respondido.');
    await load();
  }catch(e){alert('Não foi possível enviar sua resposta. Tente novamente.')}
};
load();
</script></body></html>
