<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitações</title>
<style>
/* paleta da logo: azul, vermelho, verde, prata e azul-marinho */
:root{--h:209;--s:92%;--l:44%;--ac:hsl(var(--h) var(--s) var(--l));--ac-d:hsl(var(--h) var(--s) calc(var(--l) - 9%));--ac2:hsl(var(--h) calc(var(--s) * .5) 95%);--hd:hsl(var(--h) 90% 7%);--stripe:linear-gradient(90deg,var(--ac) 0,#e11d25 55%,#62b312 100%);--on:#fff;--bg:#f1f5fb;--card:#fff;--tx:#0e1a2e;--mu:#5d6b82;--bd:#dde4ef;--dg:#d71920;--okc:#3a8d12;--sh:0 1px 2px rgba(8,20,45,.06),0 3px 12px rgba(8,20,45,.05)}
@media (prefers-color-scheme:dark){:root{--l:55%;--ac2:hsl(var(--h) calc(var(--s) * .45) 20%);--hd:hsl(var(--h) 90% 5%);--bg:#070d1a;--card:#0f1829;--tx:#e7edf8;--mu:#93a1b8;--bd:#1f2d46;--dg:#ff6b6f;--okc:#7ed321;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:680px;margin:auto;padding:0 16px 48px}
#hd{background:var(--hd);color:#fff;border:0;border-radius:0 0 20px 20px;padding:26px 22px 32px;margin:0 -16px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#hd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--stripe)}
#hd img{max-height:60px;max-width:190px;border-radius:10px;margin:0!important}
#hd h1{font-size:21px;margin:0}#hd .mu{color:#c9d6ea}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:18px 0 10px;padding-left:10px;border-left:4px solid var(--ac)}
h2:first-child{margin-top:0}
.mu{color:var(--mu);font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:6px}.w2{grid-column:span 2}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:var(--ac)}
textarea{min-height:120px;resize:vertical}
button,.btn{display:inline-block;border:0;border-radius:11px;padding:13px 22px;background:var(--ac);color:#fff;font:700 15px inherit;cursor:pointer;text-decoration:none;margin-top:8px}
button:hover,.btn:hover{background:var(--ac-d)}button:disabled{opacity:.6}
#go{width:100%}
.err{color:var(--dg);margin:8px 0}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
@media (max-width:600px){.w2{grid-column:1/-1}}
</style></head><body><main>
<div class="card" id="hd"><h1>Solicitações</h1></div>
<form id="f" class="card" autocomplete="on">
<h2>Como podemos ajudar?</h2>
<div class="g"><div class="w2"><label>Tipo de solicitação *</label>
<select id="tipo" required><option>Orçamento</option><option>Serviço</option><option>Atendimento</option><option>Informações</option></select></div></div>
<h2>Seus dados</h2>
<div class="g">
<div><label>CNPJ ou CPF *</label><input id="doc" required inputmode="numeric"></div>
<div><label>Nome ou razão social *</label><input id="nome" required></div>
<div><label>Nome do contato *</label><input id="contato" required></div>
<div><label>Telefone / WhatsApp *</label><input id="tel" type="tel" required></div>
<div class="w2"><label>E-mail *</label><input id="email" type="email" required></div>
</div>
<h2>Endereço</h2>
<div class="g">
<div><label>CEP</label><input id="cep" maxlength="9" inputmode="numeric" placeholder="00000-000"></div>
<div class="w2"><label>Endereço</label><input id="rua"></div>
<div><label>Número</label><input id="numero"></div>
<div class="w2"><label>Complemento (sala, prédio, andar…)</label><input id="comp"></div>
<div><label>Bairro</label><input id="bairro"></div>
<div><label>Cidade</label><input id="cidade"></div>
<div><label>UF</label><input id="uf" maxlength="2"></div>
</div>
<div id="cepmsg" class="mu"></div>
<h2>Sua solicitação</h2>
<textarea id="desc" required placeholder="Descreva o que você precisa" maxlength="3000"></textarea>
<div class="hp" aria-hidden="true"><label>Não preencha</label><input id="website" tabindex="-1" autocomplete="off"></div>
<div id="msg" class="err"></div>
<button id="go" type="submit">Enviar solicitação</button>
</form>
<div id="ok" class="card" style="display:none"></div>
</main>
<script>
// >>> Preencha com os dados do seu projeto Supabase (Project Settings > API)
const SB_URL='https://wbwzwqrfvwymuluznqyt.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indid3p3cXJmdnd5bXVsdXpucXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODk4NDgsImV4cCI6MjEwNzc2NTg0OH0.aR1a1AtZ5jB-r7GpQ7F4O4IyQbOp8lrHkSZlvpPcx0A';

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const owner=new URLSearchParams(location.search).get('e');
let emp={};
function hex2hsl(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return null;const n=parseInt(m[1],16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360}return{h,s:Math.round(s*100)}}
function applyTheme(hex){const c=hex2hsl(hex),r=document.documentElement.style;
 if(!c||c.s<12){r.removeProperty('--h');r.removeProperty('--s');return}
 r.setProperty('--h',c.h);r.setProperty('--s',Math.min(85,Math.max(45,c.s))+'%');
 try{localStorage.setItem('orc-tema',hex)}catch(e){}}
try{applyTheme(localStorage.getItem('orc-tema'))}catch(e){}
async function rpc(fn,body){
  const h={'Content-Type':'application/json',apikey:SB_KEY};
  if(SB_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SB_KEY;
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status);return r.json();
}
(async()=>{
  if(!owner){$('f').style.display='none';$('hd').innerHTML='<p>Link inválido.</p>';return}
  if(SB_URL.startsWith('COLE')){$('f').style.display='none';$('hd').innerHTML='<p>Falta configurar SB_URL e SB_KEY no início deste arquivo.</p>';return}
  let falha=false;
  try{emp=(await rpc('empresa_publica',{p_owner:owner}))||{}}catch(e){falha=true}
  if(!emp.nome){$('f').style.display='none';
    $('hd').innerHTML=falha?'<p>Não foi possível conectar ao servidor. Confira a URL e a chave neste arquivo e se o SQL foi executado no Supabase.</p>'
      :'<p>Empresa não encontrada. Entre no painel (index.html), preencha o nome da empresa em "Dados da empresa" e aguarde aparecer "salvo ✓".</p>';return}
  applyTheme(emp.cor);$('hd').innerHTML=(emp.logo&&String(emp.logo).startsWith('data:image/')?'<img src="'+emp.logo+'" alt="" style="max-height:56px;max-width:180px;display:block;margin-bottom:8px">':'')+'<div><h1>'+esc(emp.nome)+'</h1><div class="mu">Faça sua solicitação abaixo. Entraremos em contato.</div></div>';
})();

$('cep').oninput=async e=>{
  let v=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v;
  if(v.length!==8)return;$('cepmsg').textContent='Buscando CEP…';
  try{const d=await(await fetch('https://viacep.com.br/ws/'+v+'/json/')).json();
    if(d.erro){$('cepmsg').textContent='CEP não encontrado. Preencha o endereço.';return}
    $('rua').value=d.logradouro||'';$('bairro').value=d.bairro||'';$('cidade').value=d.localidade||'';$('uf').value=d.uf||'';
    $('cepmsg').textContent='';$('numero').focus();
  }catch(err){$('cepmsg').textContent='Não foi possível buscar o CEP. Preencha o endereço.'}
};

$('f').onsubmit=async ev=>{
  ev.preventDefault();$('msg').textContent='';$('go').disabled=true;
  const p={tipo:$('tipo').value,doc:$('doc').value.trim(),nome:$('nome').value.trim(),contato:$('contato').value.trim(),
    tel:$('tel').value.trim(),email:$('email').value.trim(),cep:$('cep').value,rua:$('rua').value.trim(),numero:$('numero').value.trim(),
    complemento:$('comp').value.trim(),bairro:$('bairro').value.trim(),cidade:$('cidade').value.trim(),uf:$('uf').value.trim().toUpperCase(),
    descricao:$('desc').value.trim(),website:$('website').value};
  try{const n=await rpc('criar_solicitacao',{p_owner:owner,p});done(n,p)}
  catch(e){$('msg').textContent='Não foi possível enviar agora. Tente novamente em instantes.';$('go').disabled=false}
};

function done(n,p){
  $('f').style.display='none';
  let t=String(emp.tel||'').replace(/\D/g,'');if(t&&t.length<=11)t='55'+t;
  const txt='Olá! Acabei de enviar a solicitação nº '+n+' ('+p.tipo+') pelo site.\nNome: '+p.nome+'\nContato: '+p.contato+' - '+p.tel;
  $('ok').style.display='block';
  $('ok').innerHTML='<h2>Solicitação enviada!</h2><p>Seu protocolo é <b>nº '+esc(n)+'</b>. Já recebemos seu pedido e entraremos em contato.</p>'
   +(t?'<p class="mu">Se preferir, envie também uma mensagem pelo WhatsApp:</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+t+'?text='+encodeURIComponent(txt)+'">Enviar pelo WhatsApp</a>':'');
}
</script></body></html>
